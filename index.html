<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D OBJ/MTL 模型 AR 空間投影工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OBJLoader & MTLLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }
    #video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .simulated-bg {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }
    /* Dynamic AR Ring Marker */
    .ar-reticle-marker {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #38bdf8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
      animation: arPulse 1.2s ease-out infinite;
    }
    @keyframes arPulse {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body class="relative select-none">

  <!-- Camera Feed Video Tag -->
  <video id="video-background" autoplay playsinline webkit-playsinline muted class="hidden"></video>
  
  <!-- Fallback Background container -->
  <div id="fallback-bg" class="simulated-bg"></div>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Screen Tap Placement Reticle Overlay -->
  <div id="ar-marker" class="ar-reticle-marker hidden"></div>

  <!-- UI Controls Overlay -->
  <div id="ui-overlay" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 pb-8 transition-opacity duration-300">

    <!-- Top Toolbar -->
    <div id="top-toolbar" class="flex flex-wrap items-center justify-between gap-2 pointer-events-auto bg-slate-900/85 backdrop-blur-md p-3 rounded-2xl border border-slate-700/50 shadow-xl text-white">
      <div class="flex items-center space-x-2">
        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <span class="font-bold text-sm sm:text-base">3D AR 實境定位投影</span>
      </div>

      <!-- Upload & Toggle Actions -->
      <div class="flex flex-wrap items-center gap-2">
        <button id="gyro-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm px-3 py-2 rounded-xl transition flex items-center space-x-1 font-medium shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          <span>iPhone 陀螺儀</span>
        </button>

        <label for="obj-input" class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm px-3 py-2 rounded-xl transition flex items-center space-x-1 font-medium shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span>載入 .OBJ</span>
        </label>
        <input type="file" id="obj-input" accept=".obj" class="hidden" />

        <label for="mtl-input" class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-white text-xs sm:text-sm px-3 py-2 rounded-xl transition flex items-center space-x-1 font-medium">
          <span>.MTL (材質)</span>
        </label>
        <input type="file" id="mtl-input" accept=".mtl" class="hidden" />

        <label for="texture-input" class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm px-2.5 py-2 rounded-xl border border-slate-600 transition flex items-center space-x-1 font-medium">
          <span>貼圖 (可選)</span>
        </label>
        <input type="file" id="texture-input" accept="image/*" class="hidden" />

        <!-- Hide UI Button inside Toolbar -->
        <button id="hide-ui-btn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 hover:text-amber-300 border border-slate-600 text-xs sm:text-sm px-3 py-2 rounded-xl transition flex items-center space-x-1 font-medium shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.03 10.03 0 013.682-.813c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-1.776 1.776l-9.9-9.9"/></svg>
          <span>隱藏介面</span>
        </button>
      </div>
    </div>

    <!-- Status Toast Notification -->
    <div id="status-toast" class="self-center bg-slate-800/90 text-slate-200 text-xs sm:text-sm px-4 py-2 rounded-full border border-slate-600 shadow-lg backdrop-blur-sm transition-opacity duration-300 pointer-events-auto text-center max-w-xs sm:max-w-md">
      📍 點擊畫面任意位置即可將物件固定於現實空間錨點。
    </div>

    <!-- Bottom Controls Deck -->
    <div id="bottom-deck" class="pointer-events-auto bg-slate-900/85 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 shadow-2xl text-white space-y-3 max-w-md w-full self-center max-h-[45vh] overflow-y-auto">
      
      <!-- Size Scale Slider -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="scale-slider" class="text-xs sm:text-sm font-medium text-slate-300 flex items-center gap-1">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            物件尺寸 (Scale)
          </label>
          <span id="scale-value" class="text-xs font-mono text-blue-400">1.0x</span>
        </div>
        <input type="range" id="scale-slider" min="0.1" max="5" step="0.05" value="1" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
      </div>

      <!-- Ground Depth Distance Slider -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="height-slider" class="text-xs sm:text-sm font-medium text-slate-300 flex items-center gap-1">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"/></svg>
            地面高度 (Floor Height)
          </label>
          <span id="height-value" class="text-xs font-mono text-purple-400">-1.2 米</span>
        </div>
        <input type="range" id="height-slider" min="-3" max="0" step="0.1" value="-1.2" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" />
      </div>

      <!-- X Rotation Slider -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="rotate-x-slider" class="text-xs sm:text-sm font-medium text-slate-300 flex items-center gap-1">
            <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
            旋轉 X 軸 (前後傾斜)
          </label>
          <span id="rotate-x-value" class="text-xs font-mono text-rose-400">0°</span>
        </div>
        <input type="range" id="rotate-x-slider" min="0" max="360" step="1" value="0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-rose-500" />
      </div>

      <!-- Y Rotation Slider -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="rotate-slider" class="text-xs sm:text-sm font-medium text-slate-300 flex items-center gap-1">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            旋轉 Y 軸 (左右自轉)
          </label>
          <span id="rotate-value" class="text-xs font-mono text-emerald-400">0°</span>
        </div>
        <input type="range" id="rotate-slider" min="0" max="360" step="1" value="0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
      </div>

      <!-- Z Rotation Slider -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="rotate-z-slider" class="text-xs sm:text-sm font-medium text-slate-300 flex items-center gap-1">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            旋轉 Z 軸 (左右滾動)
          </label>
          <span id="rotate-z-value" class="text-xs font-mono text-amber-400">0°</span>
        </div>
        <input type="range" id="rotate-z-slider" min="0" max="360" step="1" value="0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500" />
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between items-center pt-1 border-t border-slate-700/60">
        <button id="reset-anchor-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600 transition">
          重置至正前方地面
        </button>
        <span class="text-[10px] text-slate-400">點擊螢幕任意位置設定新 AR 錨點</span>
      </div>

    </div>
  </div>

  <!-- Floating Show UI Restore Button (Only visible when UI is hidden) -->
  <button id="show-ui-btn" class="hidden absolute top-4 right-4 z-20 bg-slate-900/90 hover:bg-slate-800 text-amber-400 px-3.5 py-2 rounded-2xl border border-slate-700/80 shadow-2xl backdrop-blur-md transition flex items-center space-x-1.5 text-xs sm:text-sm font-semibold pointer-events-auto">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
    <span>顯示介面</span>
  </button>

  <script>
    let scene, camera, renderer;
    let targetObjectPivot = null;
    let loadedMesh = null;
    let groundGrid = null;
    let visualReticleRing = null;
    let mtlMaterials = null;
    let customTexture = null;

    // Spatial Anchoring
    let floorY = -1.2;
    let anchorWorldPosition = new THREE.Vector3(0, -1.2, -2.5);
    const raycaster = new THREE.Raycaster();
    const mouseVector = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -floorY);

    // Camera Orbit/View Controls
    let isDraggingView = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let cameraPitch = 0; // Vertical angle
    let cameraYaw = 0;   // Horizontal angle

    // Gyroscope tracking variables
    let gyroEnabled = false;
    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    // UI Elements
    const video = document.getElementById('video-background');
    const fallbackBg = document.getElementById('fallback-bg');
    const container = document.getElementById('canvas-container');
    const arMarker = document.getElementById('ar-marker');
    const objInput = document.getElementById('obj-input');
    const mtlInput = document.getElementById('mtl-input');
    const textureInput = document.getElementById('texture-input');
    const scaleSlider = document.getElementById('scale-slider');
    const scaleValue = document.getElementById('scale-value');
    const heightSlider = document.getElementById('height-slider');
    const heightValue = document.getElementById('height-value');
    const rotateXSlider = document.getElementById('rotate-x-slider');
    const rotateXValue = document.getElementById('rotate-x-value');
    const rotateSlider = document.getElementById('rotate-slider');
    const rotateValue = document.getElementById('rotate-value');
    const rotateZSlider = document.getElementById('rotate-z-slider');
    const rotateZValue = document.getElementById('rotate-z-value');
    const statusToast = document.getElementById('status-toast');
    const resetAnchorBtn = document.getElementById('reset-anchor-btn');
    const gyroBtn = document.getElementById('gyro-btn');
    
    const uiOverlay = document.getElementById('ui-overlay');
    const hideUiBtn = document.getElementById('hide-ui-btn');
    const showUiBtn = document.getElementById('show-ui-btn');

    // UI Toggle Visibility Handler
    let isUiVisible = true;
    function toggleUiVisibility(show) {
      isUiVisible = show;
      if (isUiVisible) {
        uiOverlay.classList.remove('opacity-0', 'pointer-events-none');
        showUiBtn.classList.add('hidden');
      } else {
        uiOverlay.classList.add('opacity-0', 'pointer-events-none');
        showUiBtn.classList.remove('hidden');
      }
    }

    hideUiBtn.addEventListener('click', () => toggleUiVisibility(false));
    showUiBtn.addEventListener('click', () => toggleUiVisibility(true));

    // Camera Feed Init tailored for iOS Safari / Mobile
    async function initCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        useFallbackEnvironment("iOS Safari 未開放相機權限，啟用 3D 模擬視角。");
        return;
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          video.play().catch(e => console.log("Video auto-play interrupted:", e));
        };

        video.classList.remove('hidden');
        fallbackBg.classList.add('hidden');
        showToast("相機已啟動！點擊畫面任意位置可設定 AR 物件錨點。");
      } catch (err) {
        console.warn("Camera init failed:", err);
        useFallbackEnvironment("未獲得鏡頭權限或在沙盒環境，已自動切換至 3D 空間模式。");
      }
    }

    function useFallbackEnvironment(msg) {
      video.classList.add('hidden');
      fallbackBg.classList.remove('hidden');
      showToast(msg);
    }

    function initThree() {
      scene = new THREE.Scene();

      // Camera positioned at head level (0, 0, 0)
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 12, 7);
      scene.add(dirLight);

      const backLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
      backLight.position.set(-5, -5, -5);
      scene.add(backLight);

      // Ground plane grid helper representing reality floor
      groundGrid = new THREE.GridHelper(15, 30, 0x38bdf8, 0x475569);
      groundGrid.position.set(0, floorY, 0);
      scene.add(groundGrid);

      // Visual Placement Reticle Ring on 3D Ground Plane
      const ringGeo = new THREE.RingGeometry(0.3, 0.35, 32);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
      visualReticleRing = new THREE.Mesh(ringGeo, ringMat);
      visualReticleRing.position.copy(anchorWorldPosition);
      scene.add(visualReticleRing);

      // Pivot Group for target 3D object
      targetObjectPivot = new THREE.Group();
      targetObjectPivot.position.copy(anchorWorldPosition);
      scene.add(targetObjectPivot);

      createDefaultCube();

      // Gesture & Pointer Events
      window.addEventListener('resize', onWindowResize);
      container.addEventListener('pointerdown', onPointerDown);
      container.addEventListener('pointermove', onPointerMove);
      container.addEventListener('pointerup', onPointerUp);

      animate();
    }

    function createDefaultCube() {
      const geometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
      const material = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        roughness: 0.3,
        metalness: 0.2
      });
      const mesh = new THREE.Mesh(geometry, material);
      
      const wireGeo = new THREE.BoxGeometry(0.62, 0.62, 0.62);
      const wireMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, wireframe: true });
      const wireMesh = new THREE.Mesh(wireGeo, wireMat);
      
      const group = new THREE.Group();
      group.add(mesh);
      group.add(wireMesh);

      setModelMesh(group);
    }

    function setModelMesh(meshOrGroup) {
      if (loadedMesh) {
        targetObjectPivot.remove(loadedMesh);
      }

      loadedMesh = meshOrGroup;

      // Center geometry bounds at pivot center
      const box = new THREE.Box3().setFromObject(loadedMesh);
      const center = box.getCenter(new THREE.Vector3());
      loadedMesh.position.sub(center);

      // Raise slightly so bottom rests on anchor floor
      const size = new THREE.Vector3();
      box.getSize(size);
      loadedMesh.position.y += size.y / 2;

      targetObjectPivot.add(loadedMesh);

      updateModelScale();
      updateModelRotation();
    }

    // Handle Screen Tap to set 3D Ground Anchor Point
    function onPointerDown(event) {
      // Don't register taps on controls UI if UI is visible
      if (isUiVisible && (event.clientY < 60 || event.clientY > window.innerHeight - 170)) return;

      isDraggingView = true;
      previousPointerPosition = { x: event.clientX, y: event.clientY };

      // Raycast from Screen Tap into 3D World Floor Plane
      mouseVector.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouseVector.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouseVector, camera);
      
      // Update Ground Plane constant
      groundPlane.constant = -floorY;
      const hitPoint = new THREE.Vector3();

      if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
        anchorWorldPosition.copy(hitPoint);
        
        // Update 3D Object & Placement Ring Location
        targetObjectPivot.position.copy(anchorWorldPosition);
        visualReticleRing.position.copy(anchorWorldPosition);

        // UI Pulse Marker Effect
        triggerMarkerPulse(event.clientX, event.clientY);
        showToast(`📍 已將 AR 錨點定位至 (${hitPoint.x.toFixed(1)}, ${hitPoint.z.toFixed(1)})`);
      }
    }

    function onPointerMove(event) {
      if (!isDraggingView) return;

      // If Gyroscope is disabled, allow touch drag to look around spatial scene
      if (!gyroEnabled) {
        const deltaX = event.clientX - previousPointerPosition.x;
        const deltaY = event.clientY - previousPointerPosition.y;

        cameraYaw -= deltaX * 0.005;
        cameraPitch -= deltaY * 0.005;
        cameraPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraPitch));

        camera.rotation.set(cameraPitch, cameraYaw, 0, 'YXZ');
      }

      previousPointerPosition = { x: event.clientX, y: event.clientY };
    }

    function onPointerUp() {
      isDraggingView = false;
    }

    function triggerMarkerPulse(x, y) {
      arMarker.style.left = `${x}px`;
      arMarker.style.top = `${y}px`;
      arMarker.classList.remove('hidden');

      setTimeout(() => {
        arMarker.classList.add('hidden');
      }, 1200);
    }

    // Gyroscope tracking for iPhone / Mobile AR
    function enableGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', onDeviceOrientation, true);
              gyroEnabled = true;
              gyroBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
              showToast("iPhone 陀螺儀動態立體追蹤已啟動！");
            } else {
              showToast("未獲得陀螺儀存取授權", true);
            }
          })
          .catch(err => {
            console.error(err);
            showToast("無法觸發 iPhone 陀螺儀請求", true);
          });
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
        gyroEnabled = true;
        gyroBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
        showToast("陀螺儀追蹤已啟動！");
      } else {
        showToast("您的裝置不支援陀螺儀感測器。", true);
      }
    }

    function onDeviceOrientation(event) {
      if (!gyroEnabled || event.alpha === null) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta = THREE.MathUtils.degToRad(event.beta || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);
      const orient = THREE.MathUtils.degToRad(window.orientation || 0);

      euler.set(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function updateModelScale() {
      if (!targetObjectPivot) return;
      const val = parseFloat(scaleSlider.value);
      targetObjectPivot.scale.set(val, val, val);
      scaleValue.textContent = `${val.toFixed(2)}x`;
    }

    function updateModelRotation() {
      if (!targetObjectPivot) return;
      const degX = parseFloat(rotateXSlider.value);
      const degY = parseFloat(rotateSlider.value);
      const degZ = parseFloat(rotateZSlider.value);

      targetObjectPivot.rotation.x = THREE.MathUtils.degToRad(degX);
      targetObjectPivot.rotation.y = THREE.MathUtils.degToRad(degY);
      targetObjectPivot.rotation.z = THREE.MathUtils.degToRad(degZ);

      rotateXValue.textContent = `${degX}°`;
      rotateValue.textContent = `${degY}°`;
      rotateZValue.textContent = `${degZ}°`;
    }

    scaleSlider.addEventListener('input', updateModelScale);
    rotateXSlider.addEventListener('input', updateModelRotation);
    rotateSlider.addEventListener('input', updateModelRotation);
    rotateZSlider.addEventListener('input', updateModelRotation);

    heightSlider.addEventListener('input', () => {
      floorY = parseFloat(heightSlider.value);
      heightValue.textContent = `${floorY.toFixed(1)} 米`;
      
      groundGrid.position.y = floorY;
      anchorWorldPosition.y = floorY;
      targetObjectPivot.position.y = floorY;
      visualReticleRing.position.y = floorY;
    });

    gyroBtn.addEventListener('click', enableGyroscope);

    resetAnchorBtn.addEventListener('click', () => {
      // Re-center 2.5 meters right in front of camera view
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      dir.y = 0; // Lock to horizontal floor
      dir.normalize();

      anchorWorldPosition.copy(camera.position).add(dir.multiplyScalar(2.5));
      anchorWorldPosition.y = floorY;

      targetObjectPivot.position.copy(anchorWorldPosition);
      visualReticleRing.position.copy(anchorWorldPosition);

      showToast("已重置錨點至正前方 2.5 米地面");
    });

    // MTL Loader
    mtlInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        try {
          if (!THREE.MTLLoader) return;
          const mtlLoader = new THREE.MTLLoader();
          mtlMaterials = mtlLoader.parse(event.target.result);
          mtlMaterials.preload();
          showToast(`材質檔 .MTL (${file.name}) 載入成功，請載入 .OBJ 檔`);
        } catch (err) {
          showToast(".MTL 檔案解析出錯", true);
        }
      };
      reader.readAsText(file);
    });

    // Texture Image Loader
    textureInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const textureLoader = new THREE.TextureLoader();
        customTexture = textureLoader.load(event.target.result, () => {
          showToast(`貼圖圖片 (${file.name}) 已載入`);
          if (loadedMesh) {
            loadedMesh.traverse((child) => {
              if (child.isMesh) {
                child.material.map = customTexture;
                child.material.needsUpdate = true;
              }
            });
          }
        });
      };
      reader.readAsDataURL(file);
    });

    // OBJ Loader
    objInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      showToast("正在解析 3D OBJ 模型...", false);

      const reader = new FileReader();
      reader.onload = function (event) {
        try {
          if (!THREE.OBJLoader) return;
          const objLoader = new THREE.OBJLoader();
          
          if (mtlMaterials) {
            objLoader.setMaterials(mtlMaterials);
          }

          const parsedObj = objLoader.parse(event.target.result);

          parsedObj.traverse((child) => {
            if (child.isMesh) {
              if (customTexture) {
                child.material.map = customTexture;
              }
              if (!child.material) {
                child.material = new THREE.MeshStandardMaterial({
                  color: 0x94a3b8,
                  roughness: 0.5,
                  metalness: 0.1
                });
              }
            }
          });

          // Auto-scale model to fit ~1 meter
          const box = new THREE.Box3().setFromObject(parsedObj);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);

          if (maxDim > 0) {
            const autoScale = 1.0 / maxDim;
            parsedObj.scale.set(autoScale, autoScale, autoScale);
          }

          setModelMesh(parsedObj);
          showToast(`成功載入 .OBJ 檔案：${file.name}`);
        } catch (err) {
          console.error("OBJ 解析失敗:", err);
          showToast("OBJ 檔案解析失敗，請確認檔案格式", true);
        }
      };

      reader.readAsText(file);
    });

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Gentle auto spin if using default cube
      if (targetObjectPivot && (!objInput.files || !objInput.files.length) && !isDraggingView) {
        targetObjectPivot.rotation.y += 0.005;
        const deg = Math.round(THREE.MathUtils.radToDeg(targetObjectPivot.rotation.y) % 360);
        rotateSlider.value = deg < 0 ? deg + 360 : deg;
        rotateValue.textContent = `${rotateSlider.value}°`;
      }

      renderer.render(scene, camera);
    }

    let toastTimeout;
    function showToast(message, isError = false) {
      statusToast.textContent = message;
      statusToast.className = `self-center text-xs sm:text-sm px-4 py-2 rounded-full border shadow-lg backdrop-blur-sm transition-opacity duration-300 pointer-events-auto text-center max-w-xs sm:max-w-md ${
        isError ? 'bg-red-900/90 text-red-200 border-red-700' : 'bg-slate-800/90 text-slate-200 border-slate-600'
      }`;
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        statusToast.style.opacity = '0.7';
      }, 4000);
      statusToast.style.opacity = '1';
    }

    window.onload = () => {
      initThree();
      initCamera();
    };
  </script>
</body>
</html>
